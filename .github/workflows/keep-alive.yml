name: Keep Backend Warm

on:
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping backend health endpoint
        env:
          BACKEND_HEALTH_URL: ${{ vars.BACKEND_HEALTH_URL }}
        run: |
          if [ -z "$BACKEND_HEALTH_URL" ]; then
            echo "::error::BACKEND_HEALTH_URL repo variable is not set."
            exit 1
          fi

          echo "Timestamp: $(date -u +"%Y-%m-%dT%H:%M:%SZ")"
          echo "Target URL: $BACKEND_HEALTH_URL"

          max_attempts=6
          attempt=1
          until [ "$attempt" -gt "$max_attempts" ]; do
            echo "--- Attempt $attempt/$max_attempts ---"
            curl_exit=0
            http_code=$(curl -s -o response.txt -w "%{http_code}" --max-time 30 \
              --connect-timeout 15 -D headers.txt "$BACKEND_HEALTH_URL") || curl_exit=$?

            if [ "$curl_exit" -eq 0 ] && [ "$http_code" -ge 200 ] && [ "$http_code" -lt 300 ]; then
              echo "HTTP status: $http_code"
              cat response.txt 2>/dev/null
              echo "Ping succeeded on attempt $attempt"
              exit 0
            fi

            echo "HTTP status: ${http_code:-none}, curl exit: $curl_exit (likely still cold-starting)"
            attempt=$((attempt + 1))
            sleep 15
          done

          echo "::error::Health check failed after $max_attempts attempts"
          echo "--- Last response headers ---"
          cat headers.txt 2>/dev/null || echo "(no headers captured)"
          echo "--- Last response body ---"
          cat response.txt 2>/dev/null || echo "(no body captured)"
          exit 1
